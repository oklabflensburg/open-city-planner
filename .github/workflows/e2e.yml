name: E2E Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENVIRONMENT: test
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/open_city_map_e2e
  CORS_ORIGINS: http://127.0.0.1:3010
  ENABLED_MODULES: analysis-areas
  REDIS_ENABLED: "false"
  MASTODON_ENABLED: "false"
  MASTODON_SSO_ENABLED: "false"
  OSM_EXTERNAL_FALLBACK_ENABLED: "false"
  OCP_FRONTEND_MODULES: analysis-areas
  NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010/api/v1
  NUXT_PUBLIC_SITE_URL: http://127.0.0.1:3010

jobs:
  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:19b6ffa248d2f864d29d6c338459f02d63c0d7ce341fa86b3bcba8484a130bff
        env:
          POSTGRES_DB: open_city_map_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_city_map_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Configure module installation root
        run: echo "OCP_MODULE_INSTALL_ROOT=${RUNNER_TEMP}/ocp-modules" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/ocp-module-analysis-areas
          ref: 06afb05fed5dab8426e0e52392d3716ba46c980a
          path: .external-analysis-areas
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pinned uv
        run: python -m pip install 'uv==0.12.5'
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev --no-editable
      - name: Install frontend dependencies
        run: |
          (cd frontend && pnpm install --frozen-lockfile)
          (cd .external-analysis-areas/frontend && pnpm install --frozen-lockfile)
      - name: Build and install pinned analysis areas bundle
        run: |
          (cd .external-analysis-areas/backend && SOURCE_DATE_EPOCH="$(git -C .. show -s --format=%ct 06afb05fed5dab8426e0e52392d3716ba46c980a)" uv build --wheel)
          (cd .external-analysis-areas/frontend && pnpm build)
          (cd backend && .venv/bin/python -m app.cli.modules bundle build \
            --manifest ../.external-analysis-areas/module.yaml \
            --backend ../.external-analysis-areas/backend/dist/ocp_module_analysis_areas-1.0.0-py3-none-any.whl \
            --frontend ../.external-analysis-areas/frontend/dist/analysis-areas-1.0.0.tgz \
            --publisher oklabflensburg --source-reference pull/2 \
            --source-repository https://github.com/oklabflensburg/ocp-module-analysis-areas \
            --source-commit 06afb05fed5dab8426e0e52392d3716ba46c980a \
            --build-workflow github-actions/e2e --license AGPL-3.0-only \
            --output "${RUNNER_TEMP}/analysis-areas-1.0.0.ocp")
          (cd backend && .venv/bin/python -m app.cli.modules install "${RUNNER_TEMP}/analysis-areas-1.0.0.ocp")
          (cd backend && .venv/bin/python -m app.cli.modules enable analysis-areas)
          eval "$(cd backend && .venv/bin/python -m app.cli.modules env --format shell)"
          printf '%s\n' \
            "ENABLED_MODULES=${ENABLED_MODULES}" \
            "OCP_ENABLED_INSTALLED_BACKEND_PATHS=${OCP_ENABLED_INSTALLED_BACKEND_PATHS}" \
            "OCP_FRONTEND_MODULES=${OCP_FRONTEND_MODULES}" \
            "OCP_INSTALLED_FRONTEND_MODULE_ROOTS=${OCP_INSTALLED_FRONTEND_MODULE_ROOTS}" \
            "OCP_EXCLUDED_BUILTIN_MODULES=${OCP_EXCLUDED_BUILTIN_MODULES}" >> "${GITHUB_ENV}"
      - name: Resolve backend module inventory
        run: |
          inventory="$(scripts/backend-module-inventory --format env)"
          printf 'OCP_BACKEND_MODULES=%s\n' "$inventory" >> "$GITHUB_ENV"
      - name: Verify E2E frontend module configuration
        working-directory: frontend
        run: pnpm modules:check
      - name: Prepare fresh database
        working-directory: backend
        run: |
          uv run python -m app.cli.module_migrations upgrade
          uv run python tests/e2e_seed.py
      - name: Verify E2E backend module configuration
        working-directory: backend
        run: uv run python -m app.cli.module_migrations preflight
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: pnpm test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
