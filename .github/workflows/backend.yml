name: Backend CI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENVIRONMENT: test
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/open_city_map_test
  REDIS_ENABLED: "false"
  MASTODON_ENABLED: "false"
  MASTODON_SSO_ENABLED: "false"
  OSM_EXTERNAL_FALLBACK_ENABLED: "false"

jobs:
  backend-lint:
    name: Backend lint and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Import application
        working-directory: backend
        run: python -c "from app.main import app; assert app.title"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        working-directory: backend
        run: pytest

  backend-migrations:
    name: Backend migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: open_city_map_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_city_map_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify single migration head
        working-directory: backend
        run: |
          alembic heads
          test "$(alembic heads | sed '/^$/d' | wc -l)" -eq 1
      - name: Upgrade fresh database
        working-directory: backend
        run: alembic upgrade head
