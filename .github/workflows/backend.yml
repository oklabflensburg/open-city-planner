name: Backend CI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENVIRONMENT: test
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/open_city_map_test
  ENABLED_MODULES: ''
  REDIS_ENABLED: "false"
  MASTODON_SSO_ENABLED: "false"
  OSM_EXTERNAL_FALLBACK_ENABLED: "false"

jobs:
  backend-lint:
    name: Backend lint and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        run: python -m pip install 'uv==0.12.5'
      - name: Verify and install locked dependencies
        working-directory: backend
        run: |
          uv lock --check
          uv sync --frozen --extra dev --no-editable
      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check app tests
      - name: Import application
        working-directory: backend
        run: uv run python -c "from app.main import app; assert app.title"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        run: python -m pip install 'uv==0.12.5'
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev --no-editable
      - name: Run pytest
        working-directory: backend
        run: uv run pytest
      - name: Verify module job contracts explicitly
        working-directory: backend
        run: uv run pytest tests/test_module_jobs.py
      - name: Verify observability contracts explicitly
        working-directory: backend
        run: uv run pytest tests/test_observability.py

  backend-migrations:
    name: Backend migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCP_MODULE_INSTALL_ROOT: ${{ runner.temp }}/ocp-modules
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:19b6ffa248d2f864d29d6c338459f02d63c0d7ce341fa86b3bcba8484a130bff
        env:
          POSTGRES_DB: open_city_map_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_city_map_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pinned uv
        run: python -m pip install 'uv==0.12.5'
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev --no-editable
      - name: Install passive Analysis Areas migration history
        run: |
          (cd frontend && pnpm install --frozen-lockfile)
          (cd backend && uv run python -m app.cli.modules \
            --root "${OCP_MODULE_INSTALL_ROOT}" install-registry analysis-areas \
            --version 1.0.0 \
            --expected-sha256 7006f31ea73f40e38f63d2065652c27ad5d3391ddcc8cfad2f149993efef3dcf)
      - name: Verify single migration head
        working-directory: backend
        run: uv run python -m app.cli.module_migrations preflight
      - name: Upgrade fresh database
        working-directory: backend
        run: uv run python -m app.cli.module_migrations upgrade
      - name: Verify module persistence and migration contracts
        working-directory: backend
        run: uv run pytest tests/test_module_persistence.py
