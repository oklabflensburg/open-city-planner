name: Frontend CI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010/api/v1
  NUXT_PUBLIC_SITE_URL: http://127.0.0.1:3010

jobs:
  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run Vitest
        working-directory: frontend
        run: pnpm test
      - name: Verify frontend module and map SDK contracts explicitly
        working-directory: frontend
        run: pnpm vitest run tests/frontend-module-host.test.ts tests/frontend-ui-contributions.test.ts tests/map-runtime.test.ts tests/map-sdk.test.ts
      - name: Verify enabled frontend module SSR explicitly
        working-directory: frontend
        run: pnpm test:modules:ssr

  frontend-typecheck:
    name: Frontend type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run Nuxt type check
        working-directory: frontend
        run: pnpm typecheck
      - name: Run Nuxt type check with example module
        working-directory: frontend
        env:
          OCP_FRONTEND_MODULES: example-module
        run: pnpm typecheck

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_PUBLIC_API_BASE_URL: https://api.stadtplaner.example.test/api/v1
      NUXT_PUBLIC_SITE_URL: https://stadtplaner.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build Nuxt application with example module
        working-directory: frontend
        env:
          OCP_FRONTEND_MODULES: example-module
        run: pnpm build
      - name: Build Nuxt application without optional modules
        working-directory: frontend
        env:
          OCP_FRONTEND_MODULES: ''
        run: pnpm build

  frontend-language-audit:
    name: Frontend language audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit visible language
        working-directory: frontend
        run: pnpm audit:language
