name: Supply Chain

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        run: python -m pip install 'uv==0.12.5'
      - name: Verify immutable supply-chain inputs
        run: python scripts/verify-supply-chain.py
      - name: Run negative policy regression tests
        run: python -m unittest scripts.tests.test_verify_supply_chain

  sbom:
    name: Release SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Generate backend CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: backend
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
          syft-version: v1.51.0
          upload-artifact: false
      - name: Generate frontend CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: frontend
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json
          syft-version: v1.51.0
          upload-artifact: false
      - name: Upload release SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sboms-${{ github.sha }}
          path: '*-sbom.cdx.json'
          if-no-files-found: error
          retention-days: 90
      - name: Attest SBOM provenance on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: '*-sbom.cdx.json'
