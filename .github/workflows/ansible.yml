name: Ansible

on:
  pull_request:
    paths:
      - 'deploy/ansible/**'
      - 'deploy/nginx/**'
      - 'deploy/observability/**'
      - 'deploy/systemd/**'
      - '.github/workflows/ansible.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/ansible/**'
      - 'deploy/nginx/**'
      - 'deploy/observability/**'
      - 'deploy/systemd/**'
      - '.github/workflows/ansible.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install ansible-core
        run: python -m pip install --require-hashes --requirement deploy/ansible/requirements.txt
      - name: Syntax-check deployment playbooks
        working-directory: deploy/ansible
        run: |
          python -m unittest discover -s tests
          ansible-playbook --syntax-check playbooks/preflight.yml
          ansible-playbook --syntax-check playbooks/bootstrap.yml
          ansible-playbook --syntax-check playbooks/deploy.yml
          ansible-playbook --syntax-check playbooks/certificates.yml
          ansible-playbook --syntax-check playbooks/monitoring.yml
          ansible-playbook --syntax-check playbooks/monitoring-certificates.yml
          ansible-playbook --syntax-check playbooks/osm-initial-import.yml
