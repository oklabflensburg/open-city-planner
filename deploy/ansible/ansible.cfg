[defaults]
inventory = inventory/production.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
nocows = true
timeout = 30
# Remote home directories on the shared host may contain legacy Ansible temp
# directories with unusable permissions. Ansible creates random mode-0700 task
# directories below this sticky system temp directory.
remote_tmp = /tmp

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
