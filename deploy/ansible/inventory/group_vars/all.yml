stadtplaner_repo_url: https://github.com/oklabflensburg/open-city-planner.git
stadtplaner_repo_path: /opt/git/open-city-planner
stadtplaner_releases_dir: /opt/stadtplaner/releases
stadtplaner_current_path: /opt/stadtplaner/current
stadtplaner_release_retention: 3
stadtplaner_min_release_free_bytes: 2147483648
stadtplaner_deploy_ref: main
stadtplaner_service_user: oklab
stadtplaner_service_group: oklab
stadtplaner_config_dir: /etc/stadtplaner
stadtplaner_env_releases_dir: "{{ stadtplaner_config_dir }}/releases"
stadtplaner_data_dir: /data/stadtplaner
stadtplaner_social_dir: /data/stadtplaner-social
stadtplaner_avatar_upload_dir: /data/uploads
stadtplaner_observability_dir: /data/stadtplaner/observability
stadtplaner_metrics_allowed_cidrs: []

# Production tracing is mandatory. The managed single-host collector and Tempo
# backend bind only to loopback.
stadtplaner_otel_required: true
stadtplaner_otel_enabled: true
stadtplaner_otel_endpoint: http://127.0.0.1:4317
stadtplaner_otel_endpoint_host: 127.0.0.1
stadtplaner_otel_endpoint_port: 4317
stadtplaner_otel_protocol: grpc
stadtplaner_otel_service_name: stadtplaner-api
stadtplaner_manage_otel_collector: true

stadtplaner_backend_port: 8008
stadtplaner_frontend_port: 3008
stadtplaner_map_renderer_enabled: true
stadtplaner_map_renderer_required: true
stadtplaner_map_renderer_bind_address: 127.0.0.1
stadtplaner_map_renderer_port: 3020
stadtplaner_map_renderer_service_user: stadtplaner-map-renderer
stadtplaner_map_renderer_service_group: stadtplaner-map-renderer
stadtplaner_map_renderer_version: 6.4.1
stadtplaner_map_renderer_integrity: sha512-eiJnCOIea2PrGmxZnocP61kEJO4IAhNS/yvkdNh+PR50qdR4khAGU/dBA0IV+uXEQCu33Fux//J1wOQ5srYVGQ==
stadtplaner_map_renderer_max_concurrency: 2
stadtplaner_map_renderer_timeout_seconds: 20
stadtplaner_map_preview_cache_dir: /data/stadtplaner/previews
stadtplaner_backend_env_file: /etc/stadtplaner/backend.env
stadtplaner_frontend_env_file: /etc/stadtplaner/frontend.env
stadtplaner_osm_env_file: /etc/stadtplaner/osm-sync.env

stadtplaner_manage_nginx: true
stadtplaner_manage_background_timers: true
stadtplaner_enable_osm_timer: true
stadtplaner_enable_statistics_timer: true
stadtplaner_enable_email_outbox_timer: true
stadtplaner_enable_domain_event_outbox_timer: true
stadtplaner_enable_social_publisher_timer: false

stadtplaner_public_host: stadtplaner.oklabflensburg.de
stadtplaner_api_host: api.stadtplaner.oklabflensburg.de
stadtplaner_developer_host: developer.stadtplaner.oklabflensburg.de
stadtplaner_enable_developer_host: false
stadtplaner_enable_rate_limit_dry_run: true
stadtplaner_require_dns_preflight: true
stadtplaner_expected_dns_addresses:
  - 89.58.56.254
  - 2a03:4000:6a:398::1

stadtplaner_public_certificate_name: stadtplaner.oklabflensburg.de
stadtplaner_api_certificate_name: api.stadtplaner.oklabflensburg.de
stadtplaner_developer_certificate_name: developer.stadtplaner.oklabflensburg.de

stadtplaner_run_migrations: true
stadtplaner_require_pre_migration_backup: true
stadtplaner_run_frontend_typecheck: false
stadtplaner_run_backend_tests: false
stadtplaner_run_frontend_tests: false
stadtplaner_require_clean_checkout: true
stadtplaner_python_version: 3.12.14
stadtplaner_uv_version: 0.12.5
stadtplaner_toolchains_dir: /opt/stadtplaner/toolchains
stadtplaner_uv_venv: "{{ stadtplaner_toolchains_dir }}/uv-{{ stadtplaner_uv_version }}"
stadtplaner_uv_python_dir: "{{ stadtplaner_toolchains_dir }}/python"

# Managed mode uses local peer authentication as the postgres system user and
# validates the custom-format archive before Alembic runs.
stadtplaner_database_backup_mode: managed
stadtplaner_database_name: open_city_map
stadtplaner_database_backup_dir: /var/backups/stadtplaner
stadtplaner_database_backup_retention: 3
stadtplaner_pre_migration_backup_command: ''

# Certbot is opt-in and must never run on each normal deploy.
stadtplaner_certbot_email: ''
stadtplaner_manage_certificates: false

# The monitoring playbook is separate and opt-in. All services bind to
# loopback unless Grafana publication is explicitly enabled.
monitoring_grafana_bind_address: 127.0.0.1
monitoring_grafana_port: 3000
monitoring_grafana_publish: false
monitoring_grafana_host: ''
monitoring_grafana_certificate_name: "{{ monitoring_grafana_host }}"
monitoring_grafana_package_version: ''
monitoring_prometheus_bind_address: 127.0.0.1
monitoring_prometheus_port: 9090
monitoring_prometheus_retention_time: 30d
monitoring_prometheus_retention_size: 10GB
monitoring_prometheus_api_scheme: http
monitoring_prometheus_api_target: "127.0.0.1:{{ stadtplaner_backend_port }}"
monitoring_readiness_url: "http://127.0.0.1:{{ stadtplaner_backend_port }}/health/ready"
monitoring_otel_health_url: http://127.0.0.1:13133/health/status
monitoring_tempo_url: http://127.0.0.1:3200
monitoring_alertmanager_targets: []
monitoring_manage_certificates: false
monitoring_certbot_email: ''
