# Copy this file OUTSIDE the repository, replace all required placeholders, and encrypt it:
#   cp vault.example.yml ~/stadtplaner-vault.yml
#   chmod 600 ~/stadtplaner-vault.yml
#   ansible-vault encrypt ~/stadtplaner-vault.yml
# Deploy it with:
#   ansible-playbook playbooks/deploy.yml \
#     -e @~/stadtplaner-vault.yml --ask-vault-pass \
#     -e stadtplaner_deploy_ref=<commit-sha>
#
# This is the complete deployment input reference. Empty values are intentionally
# disabled optional integrations unless a comment says otherwise. Never commit real secrets.

