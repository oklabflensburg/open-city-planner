# Complete deploy/osm-sync.env.example, installed as /etc/stadtplaner/osm-sync.env.
# Database passwords belong in ~oklab/.pgpass (mode 0600), not in this file.
stadtplaner_osm_env_content: |
  PGHOST=127.0.0.1
  PGPORT=5432
  PGDATABASE=open_city_map
  PGUSER=osm
  OSM_APPLICATION_DB_ROLE=
  OSM_DATA_DIR=/data/stadtplaner
  OSM_REPOSITORY=/opt/git/open-city-planner
  OSM_BACKEND_DIR=/opt/git/open-city-planner/backend
  OSM_OUTPUT_SCHEMA=osm_import
  OSM_MIDDLE_SCHEMA=osm_middle
  OSM_PREFIX=stadtplaner_osm
  OSM_STYLE=/opt/git/open-city-planner/scripts/osm/osm.lua
  OSM_PBF_URL=https://download.geofabrik.de/europe/germany/schleswig-holstein-latest.osm.pbf
  OSM_PBF_MD5_URL=https://download.geofabrik.de/europe/germany/schleswig-holstein-latest.osm.pbf.md5
  OSM_REPLICATION_URL=https://planet.openstreetmap.org/replication/minute
  OSM_MUNICIPALITY=Flensburg
  OSM_CACHE_MB=1024
  OSM_MAX_DIFF_MB=100
  OSM_BBOX_WEST=7.5
  OSM_BBOX_SOUTH=53.3
  OSM_BBOX_EAST=11.6
  OSM_BBOX_NORTH=55.2

# Runtime management. These mirror roles/stadtplaner_runtime/defaults/main.yml.
stadtplaner_manage_node_runtime: true
stadtplaner_nodesource_keyring: /usr/share/keyrings/nodesource.gpg
stadtplaner_nodesource_repository_file: /etc/apt/sources.list.d/nodesource.list
stadtplaner_node_version: 22.23.2
stadtplaner_nodesource_package_version: 22.23.2-1nodesource1
stadtplaner_corepack_version: 0.35.0
stadtplaner_pnpm_version: 11.22.0
stadtplaner_python_version: 3.12.14
stadtplaner_uv_version: 0.12.5
stadtplaner_toolchains_dir: /opt/stadtplaner/toolchains
stadtplaner_uv_venv: "{{ stadtplaner_toolchains_dir }}/uv-{{ stadtplaner_uv_version }}"
stadtplaner_uv_python_dir: "{{ stadtplaner_toolchains_dir }}/python"

# Deployment paths, services and feature switches. These mirror inventory/group_vars/all.yml.
stadtplaner_repo_url: https://github.com/oklabflensburg/open-city-planner.git
stadtplaner_repo_path: /opt/git/open-city-planner
