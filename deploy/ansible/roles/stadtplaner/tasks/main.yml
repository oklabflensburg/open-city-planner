---
- name: Ensure service and configuration directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ stadtplaner_config_dir }}", owner: root, group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_env_releases_dir }}", owner: root, group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_data_dir }}", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_social_dir }}", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_avatar_upload_dir }}", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_avatar_upload_dir }}/avatars", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_observability_dir }}", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_map_preview_cache_dir }}", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }

- name: Find stale incomplete map preview cache writes
  ansible.builtin.find:
    paths: "{{ stadtplaner_map_preview_cache_dir }}"
    patterns: '*.partial'
    file_type: file
    recurse: true
    age: 1h
  register: stadtplaner_stale_map_preview_partials

- name: Remove stale incomplete map preview cache writes
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stadtplaner_stale_map_preview_partials.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Install OSM environment from encrypted variable when supplied
  ansible.builtin.copy:
    content: "{{ stadtplaner_osm_env_content }}"
    dest: "{{ stadtplaner_osm_env_file }}"
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  when: stadtplaner_osm_env_content is defined
  no_log: true

- name: Inspect active application environment files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop:
    - "{{ stadtplaner_backend_env_file }}"
    - "{{ stadtplaner_frontend_env_file }}"
  register: stadtplaner_active_env_stats

- name: Require target application environment input
  ansible.builtin.assert:
    that:
      - stadtplaner_backend_env_content is defined or stadtplaner_active_env_stats.results[0].stat.exists
      - stadtplaner_frontend_env_content is defined or stadtplaner_active_env_stats.results[1].stat.exists
    fail_msg: >-
      Backend and frontend environments must be supplied by the encrypted vault
      or already exist as active server-side files.
  no_log: true

- name: Verify required OSM environment exists
  ansible.builtin.stat:
    path: "{{ stadtplaner_osm_env_file }}"
  register: stadtplaner_osm_env_stat
  when: stadtplaner_enable_osm_timer

- name: Refuse deployment without required OSM environment
  ansible.builtin.assert:
    that: stadtplaner_osm_env_stat.stat.exists and stadtplaner_osm_env_stat.stat.isreg
    fail_msg: "Required OSM environment is missing. Supply it through the encrypted vault."
  when: stadtplaner_enable_osm_timer
  no_log: true

- name: Update repository to the requested ref without discarding local changes
  ansible.builtin.git:
    repo: "{{ stadtplaner_repo_url }}"
    dest: "{{ stadtplaner_repo_path }}"
    version: "{{ stadtplaner_deploy_ref }}"
    update: true
    force: false
  become_user: "{{ stadtplaner_service_user }}"
  register: stadtplaner_git

- name: Record the currently active release before switching
  ansible.builtin.stat:
    path: "{{ stadtplaner_current_path }}"
    follow: false
  register: stadtplaner_current_release_stat

- name: Initialize rollback release state
  ansible.builtin.set_fact:
    stadtplaner_previous_release_path: ''
    stadtplaner_previous_release_sha: ''
    stadtplaner_previous_env_dir: ''
    stadtplaner_previous_backend_env: ''
    stadtplaner_previous_frontend_env: ''

- name: Capture the previously active release for rollback
  ansible.builtin.set_fact:
    stadtplaner_previous_release_path: "{{ stadtplaner_current_release_stat.stat.lnk_source | default('') }}"
  when: stadtplaner_current_release_stat.stat.exists and stadtplaner_current_release_stat.stat.islnk

- name: Validate the active backend environment against the active release
  ansible.builtin.command:
    argv:
      - "{{ stadtplaner_previous_release_path }}/backend/.venv/bin/python"
      - -c
      - "from app.core.config import Settings; Settings()"
    chdir: "{{ stadtplaner_previous_release_path }}/backend"
  become_user: "{{ stadtplaner_service_user }}"
  register: stadtplaner_active_backend_env_validation
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - stadtplaner_previous_release_path | default('') | length > 0
    - stadtplaner_active_env_stats.results[0].stat.exists

- name: Refuse deployment when active code and environment are incompatible
  ansible.builtin.assert:
    that: stadtplaner_active_backend_env_validation.rc == 0
    fail_msg: >-
      The active backend environment is incompatible with the active release.
      Recover /etc/stadtplaner/backend.env as documented before deploying again.
  when:
    - stadtplaner_previous_release_path | default('') | length > 0
    - stadtplaner_active_env_stats.results[0].stat.exists

- name: Define previous release environment snapshot paths
  ansible.builtin.set_fact:
    stadtplaner_previous_release_sha: "{{ stadtplaner_previous_release_path | basename }}"
    stadtplaner_previous_env_dir: "{{ stadtplaner_env_releases_dir }}/{{ stadtplaner_previous_release_path | basename }}"
    stadtplaner_previous_backend_env: "{{ stadtplaner_env_releases_dir }}/{{ stadtplaner_previous_release_path | basename }}/backend.env"
    stadtplaner_previous_frontend_env: "{{ stadtplaner_env_releases_dir }}/{{ stadtplaner_previous_release_path | basename }}/frontend.env"
  when: stadtplaner_previous_release_path | default('') | length > 0

- name: Ensure previous release environment snapshot directory exists
  ansible.builtin.file:
    path: "{{ stadtplaner_previous_env_dir }}"
    state: directory
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0750'
  when: stadtplaner_previous_release_path | default('') | length > 0

- name: Inspect previous release environment snapshots
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ stadtplaner_previous_backend_env }}"
    - "{{ stadtplaner_previous_frontend_env }}"
  register: stadtplaner_previous_env_snapshot_stats
  when: stadtplaner_previous_release_path | default('') | length > 0

- name: Snapshot legacy active environments for rollback
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    remote_src: true
    force: false
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  loop:
    - source: "{{ stadtplaner_backend_env_file }}"
      destination: "{{ stadtplaner_previous_backend_env }}"
      exists: "{{ stadtplaner_previous_env_snapshot_stats.results[0].stat.exists }}"
    - source: "{{ stadtplaner_frontend_env_file }}"
      destination: "{{ stadtplaner_previous_frontend_env }}"
      exists: "{{ stadtplaner_previous_env_snapshot_stats.results[1].stat.exists }}"
  when:
    - stadtplaner_previous_release_path | default('') | length > 0
    - not item.exists | bool
  no_log: true

- name: Bind previous environment snapshots to their release SHA
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^STADTPLANER_RELEASE_SHA='
    line: "STADTPLANER_RELEASE_SHA={{ stadtplaner_previous_release_sha }}"
    create: false
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  loop:
    - "{{ stadtplaner_previous_backend_env }}"
    - "{{ stadtplaner_previous_frontend_env }}"
  when: stadtplaner_previous_release_path | default('') | length > 0
  no_log: true

- name: Ensure the release root is present
  ansible.builtin.file:
    path: "{{ stadtplaner_releases_dir }}"
    state: directory
    owner: "{{ stadtplaner_service_user }}"
    group: "{{ stadtplaner_service_group }}"
    mode: '0755'

- name: Ensure managed database backup directory exists
  ansible.builtin.file:
    path: "{{ stadtplaner_database_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Require a safe managed database backup retention
  ansible.builtin.assert:
    that:
      - stadtplaner_database_backup_retention | int >= 2
    fail_msg: "stadtplaner_database_backup_retention must retain at least two validated backups."
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Find stale partial managed database backups
  ansible.builtin.find:
    paths: "{{ stadtplaner_database_backup_dir }}"
    patterns: '.stadtplaner-*.dump.partial'
    file_type: file
    age: 10m
  register: stadtplaner_stale_partial_backups
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Remove stale partial managed database backups
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stadtplaner_stale_partial_backups.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Find validated managed database backups
  ansible.builtin.find:
    paths: "{{ stadtplaner_database_backup_dir }}"
    patterns: 'stadtplaner-*.dump'
    file_type: file
  register: stadtplaner_validated_backups
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Prune validated backups to make room for the new backup
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: >-
    {{ (stadtplaner_validated_backups.files | default([]) | sort(attribute='mtime', reverse=true))
       [(stadtplaner_database_backup_retention | int - 1):] }}
  loop_control:
    label: "{{ item.path }}"
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Read free space available for release assembly
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import os, sys;
        stats = os.statvfs(sys.argv[1]);
        print(stats.f_bavail * stats.f_frsize)
      - "{{ stadtplaner_releases_dir }}"
  register: stadtplaner_release_free_space
  changed_when: false

- name: Require enough free space to assemble a release
  ansible.builtin.assert:
    that:
      - stadtplaner_release_free_space.stdout | int >= stadtplaner_min_release_free_bytes | int
    fail_msg: >-
      Cannot assemble a release: only {{ stadtplaner_release_free_space.stdout | int }} bytes are free
      on the filesystem containing {{ stadtplaner_releases_dir }}, but
      {{ stadtplaner_min_release_free_bytes | int }} bytes are required. Free disk space and rerun
      the complete playbook.

- name: Resolve the target release path
  ansible.builtin.set_fact:
    stadtplaner_release_sha: "{{ stadtplaner_git.after | default(stadtplaner_deploy_ref) }}"
    stadtplaner_release_path: >-
      {{ stadtplaner_releases_dir }}/{{ (stadtplaner_git.after | default(stadtplaner_deploy_ref)) | regex_replace('[^A-Za-z0-9._-]+', '-') }}

- name: Define target release environment snapshot paths
  ansible.builtin.set_fact:
    stadtplaner_target_env_dir: "{{ stadtplaner_env_releases_dir }}/{{ stadtplaner_release_sha }}"
    stadtplaner_target_backend_env: "{{ stadtplaner_env_releases_dir }}/{{ stadtplaner_release_sha }}/backend.env"
    stadtplaner_target_frontend_env: "{{ stadtplaner_env_releases_dir }}/{{ stadtplaner_release_sha }}/frontend.env"

- name: Ensure target release environment snapshot directory exists
  ansible.builtin.file:
    path: "{{ stadtplaner_target_env_dir }}"
    state: directory
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0750'

- name: Install target backend environment snapshot from encrypted input
  ansible.builtin.copy:
    content: >-
      {{ (stadtplaner_backend_env_content
          | regex_replace('(?m)^STADTPLANER_RELEASE_SHA=.*\n?', '')
          | trim) }}
    dest: "{{ stadtplaner_target_backend_env }}"
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  when: stadtplaner_backend_env_content is defined
  no_log: true

- name: Install target frontend environment snapshot from encrypted input
  ansible.builtin.copy:
    content: >-
      {{ (stadtplaner_frontend_env_content
          | regex_replace('(?m)^STADTPLANER_RELEASE_SHA=.*\n?', '')
          | trim) }}
    dest: "{{ stadtplaner_target_frontend_env }}"
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  when: stadtplaner_frontend_env_content is defined
  no_log: true

- name: Inspect target release environment snapshots
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ stadtplaner_target_backend_env }}"
    - "{{ stadtplaner_target_frontend_env }}"
  register: stadtplaner_target_env_snapshot_stats

- name: Seed missing target environment snapshots from the active release
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    remote_src: true
    force: false
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  loop:
    - source: "{{ stadtplaner_backend_env_file }}"
      destination: "{{ stadtplaner_target_backend_env }}"
      supplied: "{{ stadtplaner_backend_env_content is defined }}"
      exists: "{{ stadtplaner_target_env_snapshot_stats.results[0].stat.exists }}"
    - source: "{{ stadtplaner_frontend_env_file }}"
      destination: "{{ stadtplaner_target_frontend_env }}"
      supplied: "{{ stadtplaner_frontend_env_content is defined }}"
      exists: "{{ stadtplaner_target_env_snapshot_stats.results[1].stat.exists }}"
  when:
    - not item.supplied | bool
    - not item.exists | bool
  no_log: true

- name: Bind target environment snapshots to the target release SHA
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^STADTPLANER_RELEASE_SHA='
    line: "STADTPLANER_RELEASE_SHA={{ stadtplaner_release_sha }}"
    insertafter: EOF
    create: false
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  loop:
    - "{{ stadtplaner_target_backend_env }}"
    - "{{ stadtplaner_target_frontend_env }}"
  no_log: true

- name: Validate target frontend environment syntax without exposing values
  ansible.builtin.command:
    argv:
      - node
      - "--env-file={{ stadtplaner_target_frontend_env }}"
      - -e
      - "process.exit(0)"
  become_user: "{{ stadtplaner_service_user }}"
  changed_when: false
  no_log: true

- name: Read target backend environment for production policy validation
  ansible.builtin.slurp:
    src: "{{ stadtplaner_target_backend_env }}"
  register: stadtplaner_backend_env_slurp
  no_log: true

- name: Extract non-secret OpenTelemetry deployment settings
  ansible.builtin.set_fact:
    stadtplaner_env_app_environment: >-
      {{ ((stadtplaner_backend_env_slurp.content | b64decode)
          | regex_findall('(?m)^APP_ENVIRONMENT=(.*)$') | first | default(''))
          | trim | trim('"') }}
    stadtplaner_env_otel_enabled: >-
      {{ ((stadtplaner_backend_env_slurp.content | b64decode)
          | regex_findall('(?m)^OTEL_ENABLED=(.*)$') | first | default(''))
          | trim | trim('"') | lower }}
    stadtplaner_env_otel_endpoint: >-
      {{ ((stadtplaner_backend_env_slurp.content | b64decode)
          | regex_findall('(?m)^OTEL_EXPORTER_OTLP_ENDPOINT=(.*)$') | first | default(''))
          | trim | trim('"') }}
    stadtplaner_env_otel_protocol: >-
      {{ ((stadtplaner_backend_env_slurp.content | b64decode)
          | regex_findall('(?m)^OTEL_EXPORTER_OTLP_PROTOCOL=(.*)$') | first | default(''))
          | trim | trim('"') | lower }}
    stadtplaner_env_otel_service_name: >-
      {{ ((stadtplaner_backend_env_slurp.content | b64decode)
          | regex_findall('(?m)^OTEL_SERVICE_NAME=(.*)$') | first | default(''))
          | trim | trim('"') }}
  no_log: true

- name: Enforce production OpenTelemetry environment policy
  ansible.builtin.assert:
    that:
      - stadtplaner_env_app_environment | lower == 'production'
      - not stadtplaner_otel_required | bool or stadtplaner_env_otel_enabled in ['1', 'true', 'yes', 'on']
      - not stadtplaner_otel_required | bool or stadtplaner_env_otel_endpoint | length > 0
      - stadtplaner_env_otel_endpoint == stadtplaner_otel_endpoint
      - stadtplaner_env_otel_protocol == stadtplaner_otel_protocol
      - stadtplaner_env_otel_service_name == stadtplaner_otel_service_name
    fail_msg: >-
      Production deployment requires OpenTelemetry tracing. OTEL_ENABLED must be
      true and OTEL endpoint, protocol and service name must match the validated
      target release environment.

- name: Prepare the versioned release tree
  ansible.builtin.file:
    path: "{{ stadtplaner_release_path }}"
    state: directory
    owner: "{{ stadtplaner_service_user }}"
    group: "{{ stadtplaner_service_group }}"
    mode: '0755'

- name: Materialize the ready-to-activate release from the requested ref
  ansible.builtin.command:
    cmd: >-
      bash -lc 'git archive --format=tar "${GIT_REF}" | tar -x -C "${RELEASE_DIR}"'
    chdir: "{{ stadtplaner_repo_path }}"
  environment:
    GIT_REF: "{{ stadtplaner_git.after | default(stadtplaner_deploy_ref) }}"
    RELEASE_DIR: "{{ stadtplaner_release_path }}"
  become_user: "{{ stadtplaner_service_user }}"

- name: Link target backend environment snapshot into the release checkout
  ansible.builtin.file:
    src: "{{ stadtplaner_target_backend_env }}"
    dest: "{{ stadtplaner_release_path }}/backend/.env"
    state: link
    force: true

- name: Link target frontend environment snapshot into the release checkout
  ansible.builtin.file:
    src: "{{ stadtplaner_target_frontend_env }}"
    dest: "{{ stadtplaner_release_path }}/frontend/.env"
    state: link
    force: true

- name: Verify the service user can read target environment snapshots
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import os, sys;
        paths = sys.argv[1:];
        raise SystemExit(0 if all(os.path.isfile(path) and os.access(path, os.R_OK) for path in paths) else 1)
      - "{{ stadtplaner_release_path }}/backend/.env"
      - "{{ stadtplaner_release_path }}/frontend/.env"
  become_user: "{{ stadtplaner_service_user }}"
  changed_when: false

- name: Ensure backend writable data directory exists
  ansible.builtin.file:
    path: "{{ stadtplaner_release_path }}/backend/data"
    state: directory
    owner: "{{ stadtplaner_service_user }}"
    group: "{{ stadtplaner_service_group }}"
    mode: '0750'

- name: Require a current backend lockfile
  ansible.builtin.command:
    cmd: "{{ stadtplaner_uv_venv }}/bin/uv lock --check"
    chdir: "{{ stadtplaner_release_path }}/backend"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ stadtplaner_uv_python_dir }}"
  become_user: "{{ stadtplaner_service_user }}"
  changed_when: false

- name: Synchronize backend from the frozen production lock
  ansible.builtin.command:
    cmd: >-
      {{ stadtplaner_uv_venv }}/bin/uv sync
      --frozen --no-editable --managed-python --no-python-downloads
      --python {{ stadtplaner_python_version }}
      {{ '--extra dev' if stadtplaner_run_backend_tests else '--no-dev' }}
    chdir: "{{ stadtplaner_release_path }}/backend"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ stadtplaner_uv_python_dir }}"
  become_user: "{{ stadtplaner_service_user }}"
  notify: Restart Stadtplaner API

- name: Validate target backend settings before release activation
  ansible.builtin.command:
    argv:
      - .venv/bin/python
      - -c
      - "from app.core.config import Settings; Settings()"
    chdir: "{{ stadtplaner_release_path }}/backend"
  become_user: "{{ stadtplaner_service_user }}"
  changed_when: false
  no_log: true

- name: Run optional backend test suite before migration
  ansible.builtin.command:
    cmd: .venv/bin/python -m pytest
    chdir: "{{ stadtplaner_release_path }}/backend"
  become_user: "{{ stadtplaner_service_user }}"
  when: stadtplaner_run_backend_tests
  changed_when: false

- name: Install frontend dependencies from lockfile
  ansible.builtin.command:
    cmd: corepack pnpm install --frozen-lockfile
    chdir: "{{ stadtplaner_release_path }}/frontend"
  become_user: "{{ stadtplaner_service_user }}"

- name: Run optional frontend typecheck
  ansible.builtin.command:
    cmd: corepack pnpm typecheck
    chdir: "{{ stadtplaner_release_path }}/frontend"
  become_user: "{{ stadtplaner_service_user }}"
  when: stadtplaner_run_frontend_typecheck
  changed_when: false

- name: Run optional frontend unit tests
  ansible.builtin.command:
    cmd: corepack pnpm test
    chdir: "{{ stadtplaner_release_path }}/frontend"
  become_user: "{{ stadtplaner_service_user }}"
  when: stadtplaner_run_frontend_tests
  changed_when: false

- name: Build production frontend
  ansible.builtin.command:
    cmd: corepack pnpm build
    chdir: "{{ stadtplaner_release_path }}/frontend"
  become_user: "{{ stadtplaner_service_user }}"
  environment:
    NODE_ENV: production
  notify: Restart Stadtplaner frontend

- name: Validate release style, package integrity, and native module loading
  ansible.builtin.command:
    argv:
      - node
      - map-preview-renderer/preflight.mjs
      - "{{ stadtplaner_release_path }}/frontend/public/map-styles/stadtplaner-light.json"
      - "{{ stadtplaner_map_renderer_version }}"
      - "{{ stadtplaner_map_renderer_integrity }}"
      - "{{ stadtplaner_release_sha }}"
    chdir: "{{ stadtplaner_release_path }}/frontend"
  become_user: "{{ stadtplaner_map_renderer_service_user }}"
  register: stadtplaner_map_renderer_preflight
  changed_when: false
  when: stadtplaner_map_renderer_enabled | bool

- name: Record the validated release style hash and native module path
  ansible.builtin.set_fact:
    stadtplaner_map_preview_style_hash: "{{ (stadtplaner_map_renderer_preflight.stdout | from_json).styleHash }}"
    stadtplaner_map_renderer_native_module_path: "{{ (stadtplaner_map_renderer_preflight.stdout | from_json).nativeModulePath }}"
  when: stadtplaner_map_renderer_enabled | bool

- name: Require all native renderer shared libraries to resolve
  ansible.builtin.command:
    argv: [ldd, "{{ stadtplaner_map_renderer_native_module_path }}"]
  become_user: "{{ stadtplaner_map_renderer_service_user }}"
  register: stadtplaner_map_renderer_ldd
  changed_when: false
  failed_when: stadtplaner_map_renderer_ldd.rc != 0 or 'not found' in stadtplaner_map_renderer_ldd.stdout
  when: stadtplaner_map_renderer_enabled | bool

- name: Match the release-installed native binary to the verified archive
  ansible.builtin.command:
    argv:
      - cmp
      - --silent
      - "{{ stadtplaner_map_renderer_native_module_path }}"
      - "{{ stadtplaner_map_renderer_toolchain_root }}/node-v{{ stadtplaner_map_renderer_node_abi }}/mbgl.node"
  become_user: "{{ stadtplaner_map_renderer_service_user }}"
  changed_when: false
  when: stadtplaner_map_renderer_enabled | bool

- name: Prove the renderer user can initialize an isolated virtual display
  ansible.builtin.command:
    argv:
      - xvfb-run
      - -a
      - -s
      - -screen 0 1280x720x24 -nolisten tcp
      - node
      - -e
      - "if (!process.env.DISPLAY) process.exit(1)"
  become_user: "{{ stadtplaner_map_renderer_service_user }}"
  changed_when: false
  when: stadtplaner_map_renderer_enabled | bool

- name: Report validated renderer release metadata
  ansible.builtin.debug:
    msg: >-
      Renderer {{ stadtplaner_map_renderer_version }}, release
      {{ stadtplaner_release_sha }}, style SHA-256
      {{ stadtplaner_map_preview_style_hash }} passed runtime preflight.
  when: stadtplaner_map_renderer_enabled | bool

- name: Require configured backup before migrations
  ansible.builtin.assert:
    that:
      - stadtplaner_database_backup_mode in ['managed', 'custom']
      - stadtplaner_database_backup_mode != 'custom' or stadtplaner_pre_migration_backup_command | length > 0
    fail_msg: >-
      Migrations require a verified backup. Use stadtplaner_database_backup_mode=managed,
      or select custom and configure stadtplaner_pre_migration_backup_command.
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)

- name: Define managed pre-migration backup path
  ansible.builtin.set_fact:
    stadtplaner_database_backup_path: >-
      {{ stadtplaner_database_backup_dir }}/stadtplaner-{{ ansible_date_time.epoch }}.dump
    stadtplaner_database_backup_partial_path: >-
      {{ stadtplaner_database_backup_dir }}/.stadtplaner-{{ ansible_date_time.epoch }}.dump.partial
  changed_when: false
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Create managed pre-migration database backup
  ansible.builtin.command:
    argv:
      - pg_dump
      - --format=custom
      - --lock-wait-timeout=30s
      - "--file={{ stadtplaner_database_backup_partial_path }}"
      - "--dbname={{ stadtplaner_database_name }}"
  become_user: postgres
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'
  changed_when: true

- name: Restrict partial database backup permissions
  ansible.builtin.file:
    path: "{{ stadtplaner_database_backup_partial_path }}"
    owner: postgres
    group: postgres
    mode: '0640'
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Inspect managed database backup
  ansible.builtin.stat:
    path: "{{ stadtplaner_database_backup_partial_path }}"
  register: stadtplaner_database_backup_stat
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Require a non-empty managed database backup
  ansible.builtin.assert:
    that:
      - stadtplaner_database_backup_stat.stat.exists
      - stadtplaner_database_backup_stat.stat.isreg
      - stadtplaner_database_backup_stat.stat.size | int > 0
    fail_msg: "Managed database backup {{ stadtplaner_database_backup_partial_path }} is missing or empty."
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Validate managed database backup archive
  ansible.builtin.command:
    argv: [pg_restore, --list, "{{ stadtplaner_database_backup_partial_path }}"]
  become_user: postgres
  changed_when: false
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Publish validated managed database backup atomically
  ansible.builtin.command:
    argv:
      - mv
      - --
      - "{{ stadtplaner_database_backup_partial_path }}"
      - "{{ stadtplaner_database_backup_path }}"
  become_user: postgres
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'
  changed_when: true

- name: Verify published managed database backup
  ansible.builtin.stat:
    path: "{{ stadtplaner_database_backup_path }}"
  register: stadtplaner_published_database_backup_stat
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Require published managed database backup before migration
  ansible.builtin.assert:
    that:
      - stadtplaner_published_database_backup_stat.stat.exists
      - stadtplaner_published_database_backup_stat.stat.isreg
      - stadtplaner_published_database_backup_stat.stat.size | int > 0
    fail_msg: "Validated database backup was not published to {{ stadtplaner_database_backup_path }}."
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Create custom pre-migration database backup
  ansible.builtin.shell: "{{ stadtplaner_pre_migration_backup_command }}"
  args:
    executable: /bin/bash
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'custom'
  changed_when: true
  no_log: true

- name: Apply Alembic migrations
  ansible.builtin.command:
    cmd: .venv/bin/alembic upgrade head
    chdir: "{{ stadtplaner_release_path }}/backend"
  become_user: "{{ stadtplaner_service_user }}"
  when: stadtplaner_run_migrations
  notify: Restart Stadtplaner API

- name: Install API and frontend systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: stadtplaner-api.service.j2, dest: stadtplaner-api.service }
    - { src: stadtplaner-frontend.service.j2, dest: stadtplaner-frontend.service }
  notify:
    - Reload systemd
    - Restart Stadtplaner API
    - Restart Stadtplaner frontend

- name: Install map renderer systemd unit
  ansible.builtin.template:
    src: stadtplaner-map-renderer.service.j2
    dest: /etc/systemd/system/stadtplaner-map-renderer.service
    owner: root
    group: root
    mode: '0644'
  when: stadtplaner_map_renderer_enabled | bool
  notify:
    - Reload systemd
    - Restart Stadtplaner map renderer

- name: Detect the superseded map preview unit name
  ansible.builtin.stat:
    path: /etc/systemd/system/stadtplaner-map-preview.service
  register: stadtplaner_legacy_map_preview_unit

- name: Disable the superseded map preview unit name
  ansible.builtin.systemd_service:
    name: stadtplaner-map-preview.service
    enabled: false
    state: stopped
    daemon_reload: true
  when: stadtplaner_legacy_map_preview_unit.stat.exists

- name: Remove the superseded map preview unit file
  ansible.builtin.file:
    path: /etc/systemd/system/stadtplaner-map-preview.service
    state: absent
  when: stadtplaner_legacy_map_preview_unit.stat.exists
  notify: Reload systemd

- name: Define background services
  ansible.builtin.set_fact:
    stadtplaner_background_services:
      - name: stadtplaner-osm-update
        description: Stadtplaner OpenStreetMap replication update
        enabled: "{{ stadtplaner_enable_osm_timer }}"
        working_directory: "{{ stadtplaner_current_path }}"
        environment_file: "{{ stadtplaner_osm_env_file }}"
        exec_start: "{{ stadtplaner_current_path }}/scripts/osm/update.sh"
        read_write_paths: ["{{ stadtplaner_data_dir }}", "{{ stadtplaner_observability_dir }}"]
        timer_description: Run Stadtplaner OpenStreetMap synchronization hourly
        on_boot: 10m
        on_unit_active: 1h
        on_calendar: ''
        accuracy: 1m
        randomized_delay: 5m
      - name: stadtplaner-flensburg-statistics-sync
        description: Stadtplaner Flensburg statistics synchronization
        enabled: "{{ stadtplaner_enable_statistics_timer }}"
        working_directory: "{{ stadtplaner_current_path }}/backend"
        environment_file: "{{ stadtplaner_backend_env_file }}"
        exec_start: "{{ stadtplaner_current_path }}/backend/.venv/bin/python -m app.cli.import_flensburg_statistics"
        read_write_paths: ["{{ stadtplaner_current_path }}/backend/data", "{{ stadtplaner_observability_dir }}"]
        timer_description: Weekly check for updated Flensburg statistics
        on_boot: ''
        on_unit_active: ''
        on_calendar: 'Mon *-*-* 03:15:00 Europe/Berlin'
        accuracy: 1m
        randomized_delay: 30m
      - name: stadtplaner-email-outbox
        description: Stadtplaner E-Mail-Outbox verarbeiten
        enabled: "{{ stadtplaner_enable_email_outbox_timer }}"
        working_directory: "{{ stadtplaner_current_path }}/backend"
        environment_file: "{{ stadtplaner_backend_env_file }}"
        exec_start: "{{ stadtplaner_current_path }}/backend/.venv/bin/python -m app.cli.process_email_outbox --limit 20"
        read_write_paths: ["{{ stadtplaner_observability_dir }}"]
        timer_description: Fällige Stadtplaner-E-Mails regelmäßig versenden
        on_boot: 1m
        on_unit_active: 1m
        on_calendar: ''
        accuracy: 10s
        randomized_delay: ''
      - name: stadtplaner-social-publisher
        description: Stadtplaner Mastodon outbox publisher
        enabled: "{{ stadtplaner_enable_social_publisher_timer }}"
        working_directory: "{{ stadtplaner_current_path }}/backend"
        environment_file: "{{ stadtplaner_backend_env_file }}"
        exec_start: "{{ stadtplaner_current_path }}/backend/.venv/bin/python -m app.cli.publish_social_outbox --limit 20"
        read_write_paths: ["{{ stadtplaner_social_dir }}", "{{ stadtplaner_observability_dir }}"]
        timer_description: Publish due Stadtplaner Mastodon outbox events
        on_boot: 2m
        on_unit_active: 1m
        on_calendar: ''
        accuracy: 10s
        randomized_delay: ''
  when: stadtplaner_manage_background_timers

- name: Install background oneshot services
  ansible.builtin.template:
    src: oneshot.service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    owner: root
    group: root
    mode: '0644'
  vars:
    unit_description: "{{ item.description }}"
    unit_working_directory: "{{ item.working_directory }}"
    unit_environment_file: "{{ item.environment_file }}"
    unit_exec_start: "{{ item.exec_start }}"
    unit_read_write_paths: "{{ item.read_write_paths }}"
  loop: "{{ stadtplaner_background_services | default([]) }}"
  when: stadtplaner_manage_background_timers
  notify: Reload systemd

- name: Install background timers
  ansible.builtin.template:
    src: timer.timer.j2
    dest: "/etc/systemd/system/{{ item.name }}.timer"
    owner: root
    group: root
    mode: '0644'
  vars:
    timer_description: "{{ item.timer_description }}"
    timer_on_boot: "{{ item.on_boot }}"
    timer_on_unit_active: "{{ item.on_unit_active }}"
    timer_on_calendar: "{{ item.on_calendar }}"
    timer_accuracy: "{{ item.accuracy }}"
    timer_randomized_delay: "{{ item.randomized_delay }}"
    timer_service: "{{ item.name }}.service"
  loop: "{{ stadtplaner_background_services | default([]) }}"
  when: stadtplaner_manage_background_timers
  notify: Reload systemd

- name: Enable or disable background timers according to configuration
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.timer"
    enabled: "{{ item.enabled | bool }}"
    state: "{{ 'started' if (item.enabled | bool) else 'stopped' }}"
    daemon_reload: true
  loop: "{{ stadtplaner_background_services | default([]) }}"
  when: stadtplaner_manage_background_timers

- name: Install Stadtplaner nginx rate-limit zones
  ansible.builtin.copy:
    src: "{{ stadtplaner_repo_path }}/deploy/nginx/conf.d/stadtplaner-rate-limits.conf"
    dest: /etc/nginx/conf.d/stadtplaner-rate-limits.conf
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when: stadtplaner_manage_nginx
  notify: Nginx configuration changed

- name: Verify required TLS certificates before writing nginx vhost
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
  loop: >-
    {{ [stadtplaner_public_certificate_name, stadtplaner_api_certificate_name]
       + ([stadtplaner_developer_certificate_name] if stadtplaner_enable_developer_host else []) }}
  register: stadtplaner_certificate_stats
  when: stadtplaner_manage_nginx

- name: Refuse nginx rollout with missing certificate
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "TLS certificate {{ item.item }} is missing; issue it first with playbooks/certificates.yml."
  loop: "{{ stadtplaner_certificate_stats.results | default([]) }}"
  when: stadtplaner_manage_nginx

- name: Install managed Stadtplaner nginx vhost
  ansible.builtin.template:
    src: stadtplaner.nginx.conf.j2
    dest: /etc/nginx/sites-available/stadtplaner
    owner: root
    group: root
    mode: '0644'
  when: stadtplaner_manage_nginx
  notify: Nginx configuration changed

- name: Enable managed Stadtplaner nginx vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/stadtplaner
    dest: /etc/nginx/sites-enabled/stadtplaner
    state: link
  when: stadtplaner_manage_nginx
  notify: Nginx configuration changed

- name: Activate the release and verify the rollout
  block:
    - name: Stop managed primary services before the code and environment switch
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        daemon_reload: true
      loop:
        - stadtplaner-api.service
        - stadtplaner-frontend.service
        - stadtplaner-map-renderer.service

    - name: Require application ports to be free before the release switch
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        state: stopped
        timeout: 15
      loop:
        - "{{ stadtplaner_backend_port }}"
        - "{{ stadtplaner_frontend_port }}"
        - "{{ stadtplaner_map_renderer_port }}"

    - name: Activate the target backend environment snapshot
      ansible.builtin.file:
        src: "{{ stadtplaner_target_backend_env }}"
        dest: "{{ stadtplaner_backend_env_file }}"
        state: link
        force: true

    - name: Activate the target frontend environment snapshot
      ansible.builtin.file:
        src: "{{ stadtplaner_target_frontend_env }}"
        dest: "{{ stadtplaner_frontend_env_file }}"
        state: link
        force: true

    - name: Switch the active release atomically while services are stopped
      ansible.builtin.file:
        src: "{{ stadtplaner_release_path }}"
        dest: "{{ stadtplaner_current_path }}"
        state: link
        force: true
      notify:
        - Restart Stadtplaner API
        - Restart Stadtplaner frontend
        - Restart Stadtplaner map renderer

    - name: Inspect activated code and environment links
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ stadtplaner_current_path }}"
        - "{{ stadtplaner_backend_env_file }}"
        - "{{ stadtplaner_frontend_env_file }}"
      register: stadtplaner_activated_release_links

    - name: Require code and environment links to reference the target release
      ansible.builtin.assert:
        that:
          - stadtplaner_activated_release_links.results[0].stat.islnk
          - stadtplaner_activated_release_links.results[0].stat.lnk_source == stadtplaner_release_path
          - stadtplaner_activated_release_links.results[1].stat.islnk
          - stadtplaner_activated_release_links.results[1].stat.lnk_source == stadtplaner_target_backend_env
          - stadtplaner_activated_release_links.results[2].stat.islnk
          - stadtplaner_activated_release_links.results[2].stat.lnk_source == stadtplaner_target_frontend_env
        fail_msg: "Code and environment activation did not converge on the target release."

    - name: Enable and start primary application services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - stadtplaner-api.service
        - stadtplaner-frontend.service
        - stadtplaner-map-renderer.service

    - name: Apply pending service and nginx handlers before smoke tests
      ansible.builtin.meta: flush_handlers

    - name: Wait for local API listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ stadtplaner_backend_port }}"
        timeout: 30

    - name: Wait for native map renderer readiness
      ansible.builtin.uri:
        url: "http://{{ stadtplaner_map_renderer_bind_address }}:{{ stadtplaner_map_renderer_port }}/health/ready"
        status_code: 200
        return_content: true
      register: stadtplaner_map_renderer_health
      failed_when: >-
        stadtplaner_map_renderer_health.status != 200 or
        (stadtplaner_map_renderer_health.json.renderer | default('')) != 'maplibre-native' or
        (stadtplaner_map_renderer_health.json.rendererVersion | default('')) != stadtplaner_map_renderer_version or
        (stadtplaner_map_renderer_health.json.releaseSha | default('')) != stadtplaner_release_sha or
        (stadtplaner_map_renderer_health.json.styleHash | default('')) != stadtplaner_map_preview_style_hash
      retries: 20
      delay: 2
      until: stadtplaner_map_renderer_health.status == 200
      when: stadtplaner_map_renderer_enabled | bool

    - name: Fetch and validate deterministic native render smoke image
      ansible.builtin.include_tasks: webp_smoke.yml
      vars:
        stadtplaner_webp_smoke_name: Native renderer smoke
        stadtplaner_webp_smoke_url: >-
          http://{{ stadtplaner_map_renderer_bind_address }}:{{ stadtplaner_map_renderer_port }}/health/smoke.webp
      when: stadtplaner_map_renderer_enabled | bool

    - name: Verify API readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ stadtplaner_backend_port }}/health/ready"
        status_code: 200
        return_content: true
      register: stadtplaner_health
      failed_when: >-
        stadtplaner_health.status != 200 or
        (stadtplaner_health.json.status | default('')) != 'ok'

    - name: Verify the FastAPI preview renderer path with binary-safe validation
      ansible.builtin.include_tasks: webp_smoke.yml
      vars:
        stadtplaner_webp_smoke_name: FastAPI map preview smoke
        stadtplaner_webp_smoke_url: >-
          http://127.0.0.1:{{ stadtplaner_backend_port }}/health/map-preview.webp
      when: stadtplaner_map_renderer_enabled | bool

    - name: Generate sampled production trace through readiness and database
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ stadtplaner_backend_port }}/health/ready"
        status_code: 200
        headers:
          X-Request-ID: "otel-deploy-{{ stadtplaner_release_sha }}"
          traceparent: >-
            00-{{ stadtplaner_release_sha[0:32] }}-{{ stadtplaner_release_sha[0:16] }}-01
      when: stadtplaner_otel_required | bool

    - name: Prove the release trace reached Tempo
      ansible.builtin.uri:
        url: >-
          http://{{ stadtplaner_tempo_http_host }}:{{ stadtplaner_tempo_http_port
          }}/api/search?q={{ ('{ resource.service.name = "' ~ stadtplaner_otel_service_name
          ~ '" && resource.service.version = "' ~ stadtplaner_release_sha ~ '" }') | urlencode
          }}&since=5m&limit=20
        status_code: 200
        return_content: true
      register: stadtplaner_otel_trace_search
      retries: 20
      delay: 2
      until: >-
        stadtplaner_otel_trace_search.json is defined and
        stadtplaner_otel_trace_search.json.traces | default([]) | length > 0
      when:
        - stadtplaner_otel_required | bool
        - stadtplaner_manage_otel_collector | bool

    - name: Wait for local frontend listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ stadtplaner_frontend_port }}"
        timeout: 30

    - name: Verify frontend root
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ stadtplaner_frontend_port }}/"
        status_code: 200
  rescue:
    - name: Preserve the original deployment failure
      ansible.builtin.set_fact:
        stadtplaner_original_failure_task: "{{ ansible_failed_task.name | default('unknown deployment task') }}"
        stadtplaner_original_failure_message: >-
          {{ (ansible_failed_result.msg | default('no module message') | string)
             | truncate(500, true, '...') }}

    - name: Restore the previous code and environment release
      block:
        - name: Require a complete previous release snapshot for rollback
          ansible.builtin.assert:
            that:
              - stadtplaner_previous_release_path | default('') | length > 0
              - stadtplaner_previous_backend_env | default('') | length > 0
              - stadtplaner_previous_frontend_env | default('') | length > 0
            fail_msg: "No complete previous code and environment snapshot is available for rollback."

        - name: Stop primary services before restoring rollback links
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop:
            - stadtplaner-api.service
            - stadtplaner-frontend.service
            - stadtplaner-map-renderer.service

        - name: Restore the previous code release link
          ansible.builtin.file:
            src: "{{ stadtplaner_previous_release_path }}"
            dest: "{{ stadtplaner_current_path }}"
            state: link
            force: true

        - name: Restore the previous backend environment link
          ansible.builtin.file:
            src: "{{ stadtplaner_previous_backend_env }}"
            dest: "{{ stadtplaner_backend_env_file }}"
            state: link
            force: true

        - name: Restore the previous frontend environment link
          ansible.builtin.file:
            src: "{{ stadtplaner_previous_frontend_env }}"
            dest: "{{ stadtplaner_frontend_env_file }}"
            state: link
            force: true

        - name: Verify rollback code and environment links
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - "{{ stadtplaner_current_path }}"
            - "{{ stadtplaner_backend_env_file }}"
            - "{{ stadtplaner_frontend_env_file }}"
          register: stadtplaner_rollback_release_links

        - name: Require rollback links to reference one previous release
          ansible.builtin.assert:
            that:
              - stadtplaner_rollback_release_links.results[0].stat.lnk_source == stadtplaner_previous_release_path
              - stadtplaner_rollback_release_links.results[1].stat.lnk_source == stadtplaner_previous_backend_env
              - stadtplaner_rollback_release_links.results[2].stat.lnk_source == stadtplaner_previous_frontend_env
            fail_msg: "Rollback code and environment links do not reference the previous release."

        - name: Detect whether the previous release contains the renderer
          ansible.builtin.stat:
            path: "{{ stadtplaner_previous_release_path }}/frontend/map-preview-renderer/server.mjs"
          register: stadtplaner_previous_renderer

        - name: Stop renderer when rolling back across its first deployment
          ansible.builtin.systemd_service:
            name: stadtplaner-map-renderer.service
            enabled: false
            state: stopped
          when: not stadtplaner_previous_renderer.stat.exists

        - name: Start previous API and frontend releases
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - stadtplaner-api.service
            - stadtplaner-frontend.service

        - name: Start previous renderer when the release provides it
          ansible.builtin.systemd_service:
            name: stadtplaner-map-renderer.service
            enabled: true
            state: started
          when: stadtplaner_previous_renderer.stat.exists

        - name: Wait for API port after rollback
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ stadtplaner_backend_port }}"
            timeout: 30

        - name: Verify API readiness after rollback
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ stadtplaner_backend_port }}/health/ready"
            status_code: 200
          register: stadtplaner_rollback_api_health
          retries: 15
          delay: 2
          until: stadtplaner_rollback_api_health.status == 200

        - name: Wait for frontend port after rollback
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ stadtplaner_frontend_port }}"
            timeout: 30

        - name: Verify frontend after rollback
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ stadtplaner_frontend_port }}/"
            status_code: 200

        - name: Verify renderer returned to the previous release
          ansible.builtin.uri:
            url: "http://{{ stadtplaner_map_renderer_bind_address }}:{{ stadtplaner_map_renderer_port }}/health/ready"
            status_code: 200
            return_content: true
          register: stadtplaner_rollback_renderer_health
          retries: 15
          delay: 2
          until: stadtplaner_rollback_renderer_health.status == 200
          failed_when: >-
            stadtplaner_rollback_renderer_health.status != 200 or
            (stadtplaner_rollback_renderer_health.json.releaseSha | default('')) != stadtplaner_previous_release_sha
          when: stadtplaner_previous_renderer.stat.exists
      rescue:
        - name: Preserve the rollback failure separately
          ansible.builtin.set_fact:
            stadtplaner_rollback_failure_task: "{{ ansible_failed_task.name | default('unknown rollback task') }}"
            stadtplaner_rollback_failure_message: >-
              {{ (ansible_failed_result.msg | default('no module message') | string)
                 | truncate(500, true, '...') }}

        - name: Collect secret-free API service state after rollback failure
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - stadtplaner-api.service
              - --property=ActiveState
              - --property=SubState
              - --property=Result
              - --property=ExecMainStatus
              - --property=NRestarts
          register: stadtplaner_rollback_api_service_state
          changed_when: false
          failed_when: false

        - name: Report both deployment and rollback failures
          ansible.builtin.fail:
            msg: >-
              Deployment failed at '{{ stadtplaner_original_failure_task }}':
              {{ stadtplaner_original_failure_message }}.
              Rollback also failed at '{{ stadtplaner_rollback_failure_task }}':
              {{ stadtplaner_rollback_failure_message }}.
              API service state: {{ stadtplaner_rollback_api_service_state.stdout | default('unavailable') }}

    - name: Report original deployment failure after successful rollback
      ansible.builtin.fail:
        msg: >-
          Deployment failed at '{{ stadtplaner_original_failure_task }}':
          {{ stadtplaner_original_failure_message }}.
          Rollback to code and environment release {{ stadtplaner_previous_release_sha }} succeeded.

- name: Require a safe release retention
  ansible.builtin.assert:
    that:
      - stadtplaner_release_retention | int >= 2
    fail_msg: "stadtplaner_release_retention must retain the active release and at least one rollback release."

- name: Find versioned release directories
  ansible.builtin.find:
    paths: "{{ stadtplaner_releases_dir }}"
    file_type: directory
    recurse: false
  register: stadtplaner_release_directories

- name: Select older inactive releases for pruning
  ansible.builtin.set_fact:
    stadtplaner_release_paths_to_prune: >-
      {{ ((stadtplaner_release_directories.files | sort(attribute='mtime', reverse=true))
          | rejectattr('path', 'equalto', stadtplaner_release_path) | list)
         [(stadtplaner_release_retention | int - 1):] }}

- name: Prune older inactive release directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stadtplaner_release_paths_to_prune }}"
  loop_control:
    label: "{{ item.path }}"

- name: Prune environment snapshots for removed releases
  ansible.builtin.file:
    path: "{{ stadtplaner_env_releases_dir }}/{{ item.path | basename }}"
    state: absent
  loop: "{{ stadtplaner_release_paths_to_prune }}"
  loop_control:
    label: "{{ stadtplaner_env_releases_dir }}/{{ item.path | basename }}"
  no_log: true

- name: Report deployed revision
  ansible.builtin.debug:
    msg: "Deployed {{ stadtplaner_git.after | default(stadtplaner_deploy_ref) }} to {{ inventory_hostname }} with active release {{ stadtplaner_current_path }}"
