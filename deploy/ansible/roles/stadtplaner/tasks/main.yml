---
- name: Ensure service and configuration directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ stadtplaner_config_dir }}", owner: root, group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_data_dir }}", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_social_dir }}", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_avatar_upload_dir }}", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_avatar_upload_dir }}/avatars", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }
    - { path: "{{ stadtplaner_observability_dir }}", owner: "{{ stadtplaner_service_user }}", group: "{{ stadtplaner_service_group }}", mode: '0750' }

- name: Install backend environment from encrypted variable when supplied
  ansible.builtin.copy:
    content: "{{ stadtplaner_backend_env_content }}"
    dest: "{{ stadtplaner_backend_env_file }}"
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  when: stadtplaner_backend_env_content is defined
  no_log: true

- name: Install frontend environment from encrypted variable when supplied
  ansible.builtin.copy:
    content: "{{ stadtplaner_frontend_env_content }}"
    dest: "{{ stadtplaner_frontend_env_file }}"
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  when: stadtplaner_frontend_env_content is defined
  no_log: true

- name: Install OSM environment from encrypted variable when supplied
  ansible.builtin.copy:
    content: "{{ stadtplaner_osm_env_content }}"
    dest: "{{ stadtplaner_osm_env_file }}"
    owner: root
    group: "{{ stadtplaner_service_group }}"
    mode: '0640'
  when: stadtplaner_osm_env_content is defined
  no_log: true

- name: Verify required environment files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: >-
    {{ [stadtplaner_backend_env_file, stadtplaner_frontend_env_file]
       + ([stadtplaner_osm_env_file] if stadtplaner_enable_osm_timer else []) }}
  register: stadtplaner_env_stats

- name: Refuse deployment without persistent environment files
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isreg
    fail_msg: "Required environment file {{ item.item }} is missing. Use an encrypted external vault or create the server-side file first."
  loop: "{{ stadtplaner_env_stats.results }}"
  no_log: true

- name: Update repository to the requested ref without discarding local changes
  ansible.builtin.git:
    repo: "{{ stadtplaner_repo_url }}"
    dest: "{{ stadtplaner_repo_path }}"
    version: "{{ stadtplaner_deploy_ref }}"
    update: true
    force: false
  become_user: "{{ stadtplaner_service_user }}"
  register: stadtplaner_git

- name: Record the currently active release before switching
  ansible.builtin.stat:
    path: "{{ stadtplaner_current_path }}"
    follow: false
  register: stadtplaner_current_release_stat

- name: Capture the previously active release for rollback
  ansible.builtin.set_fact:
    stadtplaner_previous_release_path: "{{ stadtplaner_current_release_stat.stat.lnk_source | default('') }}"
  when: stadtplaner_current_release_stat.stat.exists and stadtplaner_current_release_stat.stat.islnk

- name: Ensure the release root is present
  ansible.builtin.file:
    path: "{{ stadtplaner_releases_dir }}"
    state: directory
    owner: "{{ stadtplaner_service_user }}"
    group: "{{ stadtplaner_service_group }}"
    mode: '0755'

- name: Ensure managed database backup directory exists
  ansible.builtin.file:
    path: "{{ stadtplaner_database_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Require a safe managed database backup retention
  ansible.builtin.assert:
    that:
      - stadtplaner_database_backup_retention | int >= 2
    fail_msg: "stadtplaner_database_backup_retention must retain at least two validated backups."
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Find stale partial managed database backups
  ansible.builtin.find:
    paths: "{{ stadtplaner_database_backup_dir }}"
    patterns: '.stadtplaner-*.dump.partial'
    file_type: file
    age: 10m
  register: stadtplaner_stale_partial_backups
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Remove stale partial managed database backups
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stadtplaner_stale_partial_backups.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Find validated managed database backups
  ansible.builtin.find:
    paths: "{{ stadtplaner_database_backup_dir }}"
    patterns: 'stadtplaner-*.dump'
    file_type: file
  register: stadtplaner_validated_backups
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Prune validated backups to make room for the new backup
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: >-
    {{ (stadtplaner_validated_backups.files | default([]) | sort(attribute='mtime', reverse=true))
       [(stadtplaner_database_backup_retention | int - 1):] }}
  loop_control:
    label: "{{ item.path }}"
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Read free space available for release assembly
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import os, sys;
        stats = os.statvfs(sys.argv[1]);
        print(stats.f_bavail * stats.f_frsize)
      - "{{ stadtplaner_releases_dir }}"
  register: stadtplaner_release_free_space
  changed_when: false

- name: Require enough free space to assemble a release
  ansible.builtin.assert:
    that:
      - stadtplaner_release_free_space.stdout | int >= stadtplaner_min_release_free_bytes | int
    fail_msg: >-
      Cannot assemble a release: only {{ stadtplaner_release_free_space.stdout | int }} bytes are free
      on the filesystem containing {{ stadtplaner_releases_dir }}, but
      {{ stadtplaner_min_release_free_bytes | int }} bytes are required. Free disk space and rerun
      the complete playbook.

- name: Resolve the target release path
  ansible.builtin.set_fact:
    stadtplaner_release_sha: "{{ stadtplaner_git.after | default(stadtplaner_deploy_ref) }}"
    stadtplaner_release_path: >-
      {{ stadtplaner_releases_dir }}/{{ (stadtplaner_git.after | default(stadtplaner_deploy_ref)) | regex_replace('[^A-Za-z0-9._-]+', '-') }}

- name: Prepare the versioned release tree
  ansible.builtin.file:
    path: "{{ stadtplaner_release_path }}"
    state: directory
    owner: "{{ stadtplaner_service_user }}"
    group: "{{ stadtplaner_service_group }}"
    mode: '0755'

- name: Materialize the ready-to-activate release from the requested ref
  ansible.builtin.command:
    cmd: >-
      bash -lc 'git archive --format=tar "${GIT_REF}" | tar -x -C "${RELEASE_DIR}"'
    chdir: "{{ stadtplaner_repo_path }}"
  environment:
    GIT_REF: "{{ stadtplaner_git.after | default(stadtplaner_deploy_ref) }}"
    RELEASE_DIR: "{{ stadtplaner_release_path }}"
  become_user: "{{ stadtplaner_service_user }}"

- name: Link persistent backend environment into the release checkout
  ansible.builtin.file:
    src: "{{ stadtplaner_backend_env_file }}"
    dest: "{{ stadtplaner_release_path }}/backend/.env"
    state: link
    force: true

- name: Link persistent frontend environment into the release checkout
  ansible.builtin.file:
    src: "{{ stadtplaner_frontend_env_file }}"
    dest: "{{ stadtplaner_release_path }}/frontend/.env"
    state: link
    force: true

- name: Verify the service user can read persistent environments
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import os, sys;
        paths = sys.argv[1:];
        raise SystemExit(0 if all(os.path.isfile(path) and os.access(path, os.R_OK) for path in paths) else 1)
      - "{{ stadtplaner_release_path }}/backend/.env"
      - "{{ stadtplaner_release_path }}/frontend/.env"
  become_user: "{{ stadtplaner_service_user }}"
  changed_when: false

- name: Ensure backend writable data directory exists
  ansible.builtin.file:
    path: "{{ stadtplaner_release_path }}/backend/data"
    state: directory
    owner: "{{ stadtplaner_service_user }}"
    group: "{{ stadtplaner_service_group }}"
    mode: '0750'

- name: Require a current backend lockfile
  ansible.builtin.command:
    cmd: "{{ stadtplaner_uv_venv }}/bin/uv lock --check"
    chdir: "{{ stadtplaner_release_path }}/backend"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ stadtplaner_uv_python_dir }}"
  become_user: "{{ stadtplaner_service_user }}"
  changed_when: false

- name: Synchronize backend from the frozen production lock
  ansible.builtin.command:
    cmd: >-
      {{ stadtplaner_uv_venv }}/bin/uv sync
      --frozen --no-editable --managed-python --no-python-downloads
      --python {{ stadtplaner_python_version }}
      {{ '--extra dev' if stadtplaner_run_backend_tests else '--no-dev' }}
    chdir: "{{ stadtplaner_release_path }}/backend"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ stadtplaner_uv_python_dir }}"
  become_user: "{{ stadtplaner_service_user }}"
  notify: Restart Stadtplaner API

- name: Run optional backend test suite before migration
  ansible.builtin.command:
    cmd: .venv/bin/python -m pytest
    chdir: "{{ stadtplaner_release_path }}/backend"
  become_user: "{{ stadtplaner_service_user }}"
  when: stadtplaner_run_backend_tests
  changed_when: false

- name: Install frontend dependencies from lockfile
  ansible.builtin.command:
    cmd: corepack pnpm install --frozen-lockfile
    chdir: "{{ stadtplaner_release_path }}/frontend"
  become_user: "{{ stadtplaner_service_user }}"

- name: Run optional frontend typecheck
  ansible.builtin.command:
    cmd: corepack pnpm typecheck
    chdir: "{{ stadtplaner_release_path }}/frontend"
  become_user: "{{ stadtplaner_service_user }}"
  when: stadtplaner_run_frontend_typecheck
  changed_when: false

- name: Run optional frontend unit tests
  ansible.builtin.command:
    cmd: corepack pnpm test
    chdir: "{{ stadtplaner_release_path }}/frontend"
  become_user: "{{ stadtplaner_service_user }}"
  when: stadtplaner_run_frontend_tests
  changed_when: false

- name: Build production frontend
  ansible.builtin.command:
    cmd: corepack pnpm build
    chdir: "{{ stadtplaner_release_path }}/frontend"
  become_user: "{{ stadtplaner_service_user }}"
  environment:
    NODE_ENV: production
  notify: Restart Stadtplaner frontend

- name: Require configured backup before migrations
  ansible.builtin.assert:
    that:
      - stadtplaner_database_backup_mode in ['managed', 'custom']
      - stadtplaner_database_backup_mode != 'custom' or stadtplaner_pre_migration_backup_command | length > 0
    fail_msg: >-
      Migrations require a verified backup. Use stadtplaner_database_backup_mode=managed,
      or select custom and configure stadtplaner_pre_migration_backup_command.
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)

- name: Define managed pre-migration backup path
  ansible.builtin.set_fact:
    stadtplaner_database_backup_path: >-
      {{ stadtplaner_database_backup_dir }}/stadtplaner-{{ ansible_date_time.epoch }}.dump
    stadtplaner_database_backup_partial_path: >-
      {{ stadtplaner_database_backup_dir }}/.stadtplaner-{{ ansible_date_time.epoch }}.dump.partial
  changed_when: false
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Create managed pre-migration database backup
  ansible.builtin.command:
    argv:
      - pg_dump
      - --format=custom
      - --lock-wait-timeout=30s
      - "--file={{ stadtplaner_database_backup_partial_path }}"
      - "--dbname={{ stadtplaner_database_name }}"
  become_user: postgres
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'
  changed_when: true

- name: Restrict partial database backup permissions
  ansible.builtin.file:
    path: "{{ stadtplaner_database_backup_partial_path }}"
    owner: postgres
    group: postgres
    mode: '0640'
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Inspect managed database backup
  ansible.builtin.stat:
    path: "{{ stadtplaner_database_backup_partial_path }}"
  register: stadtplaner_database_backup_stat
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Require a non-empty managed database backup
  ansible.builtin.assert:
    that:
      - stadtplaner_database_backup_stat.stat.exists
      - stadtplaner_database_backup_stat.stat.isreg
      - stadtplaner_database_backup_stat.stat.size | int > 0
    fail_msg: "Managed database backup {{ stadtplaner_database_backup_partial_path }} is missing or empty."
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Validate managed database backup archive
  ansible.builtin.command:
    argv: [pg_restore, --list, "{{ stadtplaner_database_backup_partial_path }}"]
  become_user: postgres
  changed_when: false
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Publish validated managed database backup atomically
  ansible.builtin.command:
    argv:
      - mv
      - --
      - "{{ stadtplaner_database_backup_partial_path }}"
      - "{{ stadtplaner_database_backup_path }}"
  become_user: postgres
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'
  changed_when: true

- name: Verify published managed database backup
  ansible.builtin.stat:
    path: "{{ stadtplaner_database_backup_path }}"
  register: stadtplaner_published_database_backup_stat
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Require published managed database backup before migration
  ansible.builtin.assert:
    that:
      - stadtplaner_published_database_backup_stat.stat.exists
      - stadtplaner_published_database_backup_stat.stat.isreg
      - stadtplaner_published_database_backup_stat.stat.size | int > 0
    fail_msg: "Validated database backup was not published to {{ stadtplaner_database_backup_path }}."
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'managed'

- name: Create custom pre-migration database backup
  ansible.builtin.shell: "{{ stadtplaner_pre_migration_backup_command }}"
  args:
    executable: /bin/bash
  when:
    - stadtplaner_run_migrations
    - stadtplaner_require_pre_migration_backup | default(true)
    - stadtplaner_database_backup_mode == 'custom'
  changed_when: true
  no_log: true

- name: Apply Alembic migrations
  ansible.builtin.command:
    cmd: .venv/bin/alembic upgrade head
    chdir: "{{ stadtplaner_release_path }}/backend"
  become_user: "{{ stadtplaner_service_user }}"
  when: stadtplaner_run_migrations
  notify: Restart Stadtplaner API

- name: Install primary systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: stadtplaner-api.service.j2, dest: stadtplaner-api.service }
    - { src: stadtplaner-frontend.service.j2, dest: stadtplaner-frontend.service }
  notify:
    - Reload systemd
    - Restart Stadtplaner API
    - Restart Stadtplaner frontend

- name: Define background services
  ansible.builtin.set_fact:
    stadtplaner_background_services:
      - name: stadtplaner-osm-update
        description: Stadtplaner OpenStreetMap replication update
        enabled: "{{ stadtplaner_enable_osm_timer }}"
        working_directory: "{{ stadtplaner_current_path }}"
        environment_file: "{{ stadtplaner_osm_env_file }}"
        exec_start: "{{ stadtplaner_current_path }}/scripts/osm/update.sh"
        read_write_paths: ["{{ stadtplaner_data_dir }}", "{{ stadtplaner_observability_dir }}"]
        timer_description: Run Stadtplaner OpenStreetMap synchronization hourly
        on_boot: 10m
        on_unit_active: 1h
        on_calendar: ''
        accuracy: 1m
        randomized_delay: 5m
      - name: stadtplaner-flensburg-statistics-sync
        description: Stadtplaner Flensburg statistics synchronization
        enabled: "{{ stadtplaner_enable_statistics_timer }}"
        working_directory: "{{ stadtplaner_current_path }}/backend"
        environment_file: "{{ stadtplaner_backend_env_file }}"
        exec_start: "{{ stadtplaner_current_path }}/backend/.venv/bin/python -m app.cli.import_flensburg_statistics"
        read_write_paths: ["{{ stadtplaner_current_path }}/backend/data", "{{ stadtplaner_observability_dir }}"]
        timer_description: Weekly check for updated Flensburg statistics
        on_boot: ''
        on_unit_active: ''
        on_calendar: 'Mon *-*-* 03:15:00 Europe/Berlin'
        accuracy: 1m
        randomized_delay: 30m
      - name: stadtplaner-email-outbox
        description: Stadtplaner E-Mail-Outbox verarbeiten
        enabled: "{{ stadtplaner_enable_email_outbox_timer }}"
        working_directory: "{{ stadtplaner_current_path }}/backend"
        environment_file: "{{ stadtplaner_backend_env_file }}"
        exec_start: "{{ stadtplaner_current_path }}/backend/.venv/bin/python -m app.cli.process_email_outbox --limit 20"
        read_write_paths: ["{{ stadtplaner_observability_dir }}"]
        timer_description: Fällige Stadtplaner-E-Mails regelmäßig versenden
        on_boot: 1m
        on_unit_active: 1m
        on_calendar: ''
        accuracy: 10s
        randomized_delay: ''
      - name: stadtplaner-social-publisher
        description: Stadtplaner Mastodon outbox publisher
        enabled: "{{ stadtplaner_enable_social_publisher_timer }}"
        working_directory: "{{ stadtplaner_current_path }}/backend"
        environment_file: "{{ stadtplaner_backend_env_file }}"
        exec_start: "{{ stadtplaner_current_path }}/backend/.venv/bin/python -m app.cli.publish_social_outbox --limit 20"
        read_write_paths: ["{{ stadtplaner_social_dir }}", "{{ stadtplaner_observability_dir }}"]
        timer_description: Publish due Stadtplaner Mastodon outbox events
        on_boot: 2m
        on_unit_active: 1m
        on_calendar: ''
        accuracy: 10s
        randomized_delay: ''
  when: stadtplaner_manage_background_timers

- name: Install background oneshot services
  ansible.builtin.template:
    src: oneshot.service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    owner: root
    group: root
    mode: '0644'
  vars:
    unit_description: "{{ item.description }}"
    unit_working_directory: "{{ item.working_directory }}"
    unit_environment_file: "{{ item.environment_file }}"
    unit_exec_start: "{{ item.exec_start }}"
    unit_read_write_paths: "{{ item.read_write_paths }}"
  loop: "{{ stadtplaner_background_services | default([]) }}"
  when: stadtplaner_manage_background_timers
  notify: Reload systemd

- name: Install background timers
  ansible.builtin.template:
    src: timer.timer.j2
    dest: "/etc/systemd/system/{{ item.name }}.timer"
    owner: root
    group: root
    mode: '0644'
  vars:
    timer_description: "{{ item.timer_description }}"
    timer_on_boot: "{{ item.on_boot }}"
    timer_on_unit_active: "{{ item.on_unit_active }}"
    timer_on_calendar: "{{ item.on_calendar }}"
    timer_accuracy: "{{ item.accuracy }}"
    timer_randomized_delay: "{{ item.randomized_delay }}"
    timer_service: "{{ item.name }}.service"
  loop: "{{ stadtplaner_background_services | default([]) }}"
  when: stadtplaner_manage_background_timers
  notify: Reload systemd

- name: Enable or disable background timers according to configuration
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.timer"
    enabled: "{{ item.enabled | bool }}"
    state: "{{ 'started' if (item.enabled | bool) else 'stopped' }}"
    daemon_reload: true
  loop: "{{ stadtplaner_background_services | default([]) }}"
  when: stadtplaner_manage_background_timers

- name: Install Stadtplaner nginx rate-limit zones
  ansible.builtin.copy:
    src: "{{ stadtplaner_repo_path }}/deploy/nginx/conf.d/stadtplaner-rate-limits.conf"
    dest: /etc/nginx/conf.d/stadtplaner-rate-limits.conf
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when: stadtplaner_manage_nginx
  notify: Nginx configuration changed

- name: Verify required TLS certificates before writing nginx vhost
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
  loop: >-
    {{ [stadtplaner_public_certificate_name, stadtplaner_api_certificate_name]
       + ([stadtplaner_developer_certificate_name] if stadtplaner_enable_developer_host else []) }}
  register: stadtplaner_certificate_stats
  when: stadtplaner_manage_nginx

- name: Refuse nginx rollout with missing certificate
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "TLS certificate {{ item.item }} is missing; issue it first with playbooks/certificates.yml."
  loop: "{{ stadtplaner_certificate_stats.results | default([]) }}"
  when: stadtplaner_manage_nginx

- name: Install managed Stadtplaner nginx vhost
  ansible.builtin.template:
    src: stadtplaner.nginx.conf.j2
    dest: /etc/nginx/sites-available/stadtplaner
    owner: root
    group: root
    mode: '0644'
  when: stadtplaner_manage_nginx
  notify: Nginx configuration changed

- name: Enable managed Stadtplaner nginx vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/stadtplaner
    dest: /etc/nginx/sites-enabled/stadtplaner
    state: link
  when: stadtplaner_manage_nginx
  notify: Nginx configuration changed

- name: Stop managed primary services before legacy handover
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    daemon_reload: true
  loop:
    - stadtplaner-api.service
    - stadtplaner-frontend.service
  when: stadtplaner_disable_legacy_primary_services

- name: Require application ports to be free after legacy handover
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    state: stopped
    timeout: 15
  loop:
    - "{{ stadtplaner_backend_port }}"
    - "{{ stadtplaner_frontend_port }}"
  when: stadtplaner_disable_legacy_primary_services

- name: Switch the active release atomically
  ansible.builtin.file:
    src: "{{ stadtplaner_release_path }}"
    dest: "{{ stadtplaner_current_path }}"
    state: link
    force: true

- name: Activate the release and verify the rollout
  block:
    - name: Enable and start primary application services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - stadtplaner-api.service
        - stadtplaner-frontend.service

    - name: Apply pending service and nginx handlers before smoke tests
      ansible.builtin.meta: flush_handlers

    - name: Wait for local API listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ stadtplaner_backend_port }}"
        timeout: 30

    - name: Verify API readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ stadtplaner_backend_port }}/health/ready"
        status_code: 200
        return_content: true
      register: stadtplaner_health
      failed_when: >-
        stadtplaner_health.status != 200 or
        (stadtplaner_health.json.status | default('')) != 'ok'

    - name: Wait for local frontend listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ stadtplaner_frontend_port }}"
        timeout: 30

    - name: Verify frontend root
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ stadtplaner_frontend_port }}/"
        status_code: 200
  rescue:
    - name: Roll back to the previous release
      ansible.builtin.file:
        src: "{{ stadtplaner_previous_release_path }}"
        dest: "{{ stadtplaner_current_path }}"
        state: link
        force: true
      when: stadtplaner_previous_release_path | default('') | length > 0

    - name: Restart the primary services after rollback
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
        daemon_reload: true
      loop:
        - stadtplaner-api.service
        - stadtplaner-frontend.service
      when: stadtplaner_previous_release_path | default('') | length > 0

    - name: Fail after automatic rollback
      ansible.builtin.fail:
        msg: "Release {{ stadtplaner_release_path }} failed smoke tests and was rolled back to {{ stadtplaner_previous_release_path }}"

- name: Require a safe release retention
  ansible.builtin.assert:
    that:
      - stadtplaner_release_retention | int >= 2
    fail_msg: "stadtplaner_release_retention must retain the active release and at least one rollback release."

- name: Find versioned release directories
  ansible.builtin.find:
    paths: "{{ stadtplaner_releases_dir }}"
    file_type: directory
    recurse: false
  register: stadtplaner_release_directories

- name: Prune older inactive release directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: >-
    {{ ((stadtplaner_release_directories.files | sort(attribute='mtime', reverse=true))
        | rejectattr('path', 'equalto', stadtplaner_release_path) | list)
       [(stadtplaner_release_retention | int - 1):] }}
  loop_control:
    label: "{{ item.path }}"

- name: Report deployed revision
  ansible.builtin.debug:
    msg: "Deployed {{ stadtplaner_git.after | default(stadtplaner_deploy_ref) }} to {{ inventory_hostname }} with active release {{ stadtplaner_current_path }}"
