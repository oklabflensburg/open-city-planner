---
- name: Restart Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted

- name: Restart node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted

- name: Restart blackbox exporter
  ansible.builtin.systemd_service:
    name: prometheus-blackbox-exporter
    state: restarted

- name: Restart Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted

- name: Reload Nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
