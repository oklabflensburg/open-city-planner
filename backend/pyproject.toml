[project]
name = "open-city-map-backend"
version = "0.1.0"
description = "FastAPI/PostGIS backend for Open City Map"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.4",
  "asyncpg>=0.30.0",
  "authlib>=1.6.1",
  "cryptography>=45.0.6",
  "email-validator>=2.3.0",
  "fastapi>=0.116.1",
  "geoalchemy2>=0.17.1",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "opentelemetry-api>=1.38.0,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.38.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-instrumentation-httpx>=0.59b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.59b0,<1",
  "opentelemetry-sdk>=1.38.0,<2",
  "pillow>=11.3.0",
  "playwright>=1.55.0",
  "prometheus-client>=0.22.1,<1",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.10.1",
  "pydantic>=2.11.7",
  "pyjwt>=2.10.1",
  "pyotp>=2.9.0",
  "python-multipart>=0.0.20",
  "redis>=5.2,<9",
  "semantic-version>=2.10.0,<3",
  "shapely>=2.1.1",
  "sqlalchemy>=2.0.42",
  "uvicorn[standard]>=0.35.0",
  "webauthn>=3.0.0,<4",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.8"
]
security = [
  "pip-audit==2.10.1",
  "pyyaml==6.0.3"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
required-version = "==0.12.5"
build-constraint-dependencies = ["setuptools==84.0.0"]
