[project]
name = "open-city-map-backend"
version = "0.1.0"
description = "FastAPI/PostGIS backend for Open City Map"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.4",
  "asyncpg>=0.30.0",
  "authlib>=1.6.1",
  "email-validator>=2.3.0",
  "fastapi>=0.116.1",
  "geoalchemy2>=0.17.1",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pillow>=11.3.0",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.10.1",
  "pydantic>=2.11.7",
  "pyjwt>=2.10.1",
  "python-multipart>=0.0.20",
  "shapely>=2.1.1",
  "sqlalchemy>=2.0.42",
  "uvicorn[standard]>=0.35.0"
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.8"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
