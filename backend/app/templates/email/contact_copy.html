{% extends "base.html" %}
{% block content %}
<p>Hallo {{ name }},</p>
<p>vielen Dank für Ihre Nachricht. Dies ist eine Kopie Ihrer Anfrage:</p>
<p><strong>Betreff:</strong><br>{{ subject }}</p>
<p><strong>Nachricht:</strong></p>
<div style="white-space:pre-wrap;overflow-wrap:anywhere;">{{ message }}</div>
<p style="margin-top:24px;">Ihre Nachricht wurde an das Stadtplaner-Team übermittelt.</p>
{% endblock %}
