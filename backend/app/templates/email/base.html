<!doctype html>
<html lang="de">
  <body style="margin:0;background:#f4f6f6;font-family:Arial,sans-serif;color:#202427;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f6;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #dde2e3;">
            <tr>
              <td style="padding:24px 28px;border-bottom:1px solid #e7ebec;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding-right:14px;vertical-align:middle;">
                      <img src="{{ logo_url }}" alt="OK Lab Flensburg" width="56" height="64" style="display:block;width:56px;height:64px;max-width:100%;">
                    </td>
                    <td style="vertical-align:middle;">
                      <strong style="display:block;font-size:18px;">OK Lab Flensburg</strong>
                      <span style="display:block;margin-top:3px;color:#687176;font-size:14px;">{{ site_name }}</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;line-height:1.55;font-size:15px;">
                {{ content }}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px;border-top:1px solid #e7ebec;color:#687176;font-size:12px;line-height:1.5;">
                OK Lab Flensburg · {{ site_name }}<br>
                <a href="{{ imprint_url }}" style="color:#154d73;">Impressum</a> ·
                <a href="{{ privacy_url }}" style="color:#154d73;">Datenschutz</a>
                {% if preferences_url %}<br><a href="{{ preferences_url }}" style="color:#154d73;">E-Mail-Einstellungen ändern</a>{% endif %}
                {% if unsubscribe_url %}<br><a href="{{ unsubscribe_url }}" style="color:#154d73;">Newsletter abbestellen</a>{% endif %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
