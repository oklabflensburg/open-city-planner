{% extends "base.html" %}
{% block content %}
<p>Hallo {{ name }},</p>
<p>Für Ihr Stadtplaner-Konto wurde das Zurücksetzen des Passworts angefordert.</p>
<p style="margin:28px 0;">
  <a href="{{ link }}" style="background:#154d73;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:6px;font-weight:bold;">Passwort zurücksetzen</a>
</p>
<p>Der Link ist {{ minutes }} Minuten gültig. Wenn Sie die Anfrage nicht gestellt haben, ist keine Aktion erforderlich.</p>
{% endblock %}
