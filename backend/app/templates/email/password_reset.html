{% extends "base.html" %}
{% block content %}
<p>Hallo {{ name }},</p>
<p>es wurde eine Anfrage zum Zurücksetzen deines Passworts gestellt.</p>
<p style="margin:28px 0;">
  <a href="{{ link }}" style="background:#154d73;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:6px;font-weight:bold;">Passwort zurücksetzen</a>
</p>
<p>Der Link ist {{ minutes }} Minuten gültig. Wenn du die Anfrage nicht gestellt hast, ist keine Aktion erforderlich.</p>
{% endblock %}
