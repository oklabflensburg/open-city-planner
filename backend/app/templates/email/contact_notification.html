{% extends "base.html" %}
{% block content %}
<h1 style="margin:0 0 20px;font-size:20px;">Neue Kontaktanfrage über Stadtplaner</h1>
<p><strong>Name:</strong><br>{{ name }}</p>
<p><strong>E-Mail:</strong><br>{{ email }}</p>
<p><strong>Betreff:</strong><br>{{ subject }}</p>
<p><strong>Nachricht:</strong></p>
<div style="white-space:pre-wrap;overflow-wrap:anywhere;">{{ message }}</div>
<p style="margin-top:24px;color:#687176;font-size:13px;"><strong>Eingegangen:</strong> {{ received_at }}</p>
{% endblock %}
